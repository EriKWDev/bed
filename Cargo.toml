[workspace]
resolver = "3"
members = [
  "code/bed",
  "code/idno_std",
  "code/bitfield",
]

[workspace.dependencies]
idno_std.path = "code/idno_std"
bitfield.path = "code/bitfield"

glam = "*"
hashbrown = { version = "0.16", default-features = false, features = ["nightly", "inline-more"] }
log = "*"
micropool = "*"
rapidhash = "*"
profiling = "*"
mimalloc = { version = "0.1", default-features = false }
